<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | Printsiv</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;font-family:Arial,sans-serif;color:#18202a}
    .card{width:min(100%,430px);background:#fff;border-radius:16px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:28px}.intro{margin:0 0 24px;color:#667085;line-height:1.5}
    label{display:block;margin:16px 0 7px;font-weight:600;font-size:14px}
    input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:9px;font-size:16px;outline:none}
    input:focus{border-color:#344054;box-shadow:0 0 0 3px rgba(52,64,84,.1)}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#111827;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .message{display:none;margin-top:18px;padding:12px 14px;border-radius:8px;line-height:1.4}
    .message.show{display:block}.error{background:#fef3f2;color:#b42318}.success{background:#ecfdf3;color:#027a48}
    .login{display:block;margin-top:20px;text-align:center;color:#344054;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p class="intro">Choose a new password for your Printsiv account.</p>

    <form id="resetForm" novalidate>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>

      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>

      <button id="submitBtn" type="submit">Reset Password</button>
      <div id="message" class="message" role="alert"></div>
    </form>

    <a class="login" href="login.html">Return to login</a>
  </main>

  <script>
    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const token = new URLSearchParams(location.search).get('token') || '';

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    if (!/^[a-f0-9]{64}$/i.test(token)) {
      button.disabled = true;
      showMessage('This password reset link is invalid or missing.', 'error');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;

      if (password.length < 8) return showMessage('Password must be at least 8 characters.', 'error');
      if (password !== confirm) return showMessage('Passwords do not match.', 'error');

      button.disabled = true;
      button.textContent = 'Resetting...';

      try {
        const body = new URLSearchParams({
          action: 'reset_password',
          token,
          password,
          confirm_password: confirm
        });
        const response = await fetch('api/auth.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body,
          credentials: 'same-origin'
        });
        const data = await response.json();

        if (!response.ok || !data.success) throw new Error(data.message || 'Unable to reset password.');
        showMessage(data.message, 'success');
        form.reset();
        button.textContent = 'Password Reset';
        setTimeout(() => { location.href = 'login.html'; }, 1800);
      } catch (error) {
        showMessage(error.message, 'error');
        button.disabled = false;
        button.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
